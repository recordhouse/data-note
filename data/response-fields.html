<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>응답 항목 매핑 테이블</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f6f8fb;
        color: #1f2933;
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      table {
        width: min(760px, 100%);
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #d8e0ea;
        border-radius: 8px;
        overflow: hidden;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #d8e0ea;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #edf2f7;
        color: #516173;
        font-size: 13px;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      code {
        color: #164f86;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>응답 항목 매핑 테이블</h1>

    <table id="responseFieldTable">
      <thead>
        <tr>
          <th>항목명</th>
          <th>키값</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>거래 ID</td>
          <td><code>transactionId</code></td>
        </tr>
        <tr>
          <td>결과 코드</td>
          <td><code>resultCode</code></td>
        </tr>
        <tr>
          <td>결과 메시지</td>
          <td><code>resultMessage</code></td>
        </tr>
        <tr>
          <td>승인 번호</td>
          <td><code>approvalNumber</code></td>
        </tr>
        <tr>
          <td>결제 금액</td>
          <td><code>amount</code></td>
        </tr>
        <tr>
          <td>통화</td>
          <td><code>currency</code></td>
        </tr>
        <tr>
          <td>고객명</td>
          <td><code>customerName</code></td>
        </tr>
        <tr>
          <td>처리 일시</td>
          <td><code>processedAt</code></td>
        </tr>
        <tr>
          <td>결제 수단</td>
          <td><code>paymentMethod</code></td>
        </tr>
        <tr>
          <td>발급사</td>
          <td><code>issuerName</code></td>
        </tr>
        <tr>
          <td>메모</td>
          <td><code>memo</code></td>
        </tr>
      </tbody>
    </table>

    <script src="../js/response-fields-loader.js"></script>
  </body>
</html>
