<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>응답 데이터 테이블</title>
  </head>
  <body>
    <table id="responseFieldTable">
      <thead>
        <tr>
          <th>데이터명</th>
          <th>데이터키값</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>거래 ID</td>
          <td>transactionId</td>
        </tr>
        <tr>
          <td>처리 일시</td>
          <td>processedAt</td>
        </tr>
        <tr>
          <td>결과 코드</td>
          <td>resultCode</td>
        </tr>
        <tr>
          <td>결과 메시지</td>
          <td>resultMessage</td>
        </tr>
        <tr>
          <td>승인 번호</td>
          <td>approvalNumber</td>
        </tr>
        <tr>
          <td>결제 금액</td>
          <td>amount</td>
        </tr>
        <tr>
          <td>통화</td>
          <td>currency</td>
        </tr>
        <tr>
          <td>결제 수단</td>
          <td>paymentMethod</td>
        </tr>
        <tr>
          <td>발급사</td>
          <td>issuerName</td>
        </tr>
        <tr>
          <td>고객명</td>
          <td>customerName</td>
        </tr>
        <tr>
          <td>메모</td>
          <td>memo</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
