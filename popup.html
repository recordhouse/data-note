<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통신 응답 매핑 리스트</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #17202a;
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .wrap {
        min-height: 100vh;
        padding: 16px;
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 168px minmax(0, 1fr);
        gap: 12px;
        padding: 11px 12px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        background: #fbfdff;
      }

      .name {
        color: #667385;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.5;
      }

      .value {
        margin: 0;
        color: #17202a;
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .exception {
        border-color: #f0c0b8;
        background: #fff9f8;
      }

      .empty {
        min-height: 160px;
        display: grid;
        place-items: center;
        border: 1px dashed #b8c5d5;
        border-radius: 8px;
        color: #667385;
        text-align: center;
      }

      @media (max-width: 560px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="list" id="mappingList">
        <div class="empty">통신 응답을 기다리는 중입니다.</div>
      </div>
    </main>

    <script src="./js/response-mapping-popup.js"></script>
  </body>
</html>
