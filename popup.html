<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통신 응답 매핑 리스트</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #17202a;
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .wrap {
        min-height: 100vh;
        padding: 16px;
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .row {
        padding: 11px 12px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        background: #fbfdff;
      }

      .tree-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        min-height: 24px;
        padding-left: calc(var(--depth) * 18px);
        color: #17202a;
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .tree-prefix {
        flex: 0 0 10px;
        color: #8a97a8;
      }

      .tree-toggle,
      .tree-toggle-placeholder {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        margin-top: 1px;
      }

      .tree-toggle {
        display: inline-grid;
        place-items: center;
        border: 1px solid #c9d3df;
        border-radius: 4px;
        background: #ffffff;
        color: #334155;
        cursor: pointer;
      }

      .tree-toggle::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 6px solid currentColor;
      }

      .tree-toggle[aria-expanded="false"]::before {
        transform: rotate(-90deg);
      }

      .tree-name {
        color: #667385;
        font-weight: 800;
      }

      .tree-separator {
        color: #667385;
        font-weight: 800;
      }

      .tree-value {
        color: #17202a;
        white-space: pre-wrap;
      }

      .empty {
        min-height: 160px;
        display: grid;
        place-items: center;
        border: 1px dashed #b8c5d5;
        border-radius: 8px;
        color: #667385;
        text-align: center;
      }

      @media (max-width: 560px) {
        .tree-row {
          padding-left: calc(var(--depth) * 14px);
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="list" id="mappingList">
        <div class="empty">통신 응답을 기다리는 중입니다.</div>
      </div>
    </main>

    <script src="./js/response-mapping-popup.js"></script>
  </body>
</html>
