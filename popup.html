<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Note</title>
    <link rel="stylesheet" href="./css/popup.css" />
  </head>
  <body>
    <main class="wrap">
      <nav class="popup-tabs" role="tablist" aria-label="통신 팝업 기능">
        <button
          class="popup-tab"
          id="userFlowTab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="userFlowPanel"
          data-popup-tab="user-flow"
        >유저 플로우</button>
        <button
          class="popup-tab"
          id="responseListTab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="responseListPanel"
          tabindex="-1"
          data-popup-tab="response-list"
        >응답 리스트</button>
      </nav>

      <section
        class="tab-panel"
        id="responseListPanel"
        role="tabpanel"
        aria-labelledby="responseListTab"
        data-popup-panel="response-list"
        hidden
      >
        <div class="response-list-layout">
          <nav
            class="communication-tabs"
            id="communicationTabs"
            role="tablist"
            aria-label="통신별 응답 리스트"
            hidden
          ></nav>

          <div class="list" id="mappingList">
            <div class="empty">통신 응답을 기다리는 중입니다.</div>
          </div>

          <section class="item-filter" id="mappingItemFilter" hidden>
            <div class="item-filter-bar">
              <button
                class="item-filter-toggle"
                id="mappingItemFilterToggle"
                type="button"
                aria-expanded="false"
                aria-controls="mappingItemFilterPanel"
                title="표시 항목 열기"
              >
                <span id="mappingItemFilterSummary">표시 항목 0/0</span>
                <span class="item-filter-chevron" aria-hidden="true"></span>
              </button>
              <input
                class="item-filter-search"
                id="mappingItemFilterSearch"
                type="search"
                placeholder="항목명 또는 키 검색"
                aria-label="표시 항목 검색"
              />
            </div>
            <div class="item-filter-panel" id="mappingItemFilterPanel" hidden>
              <label class="item-filter-label item-filter-all">
                <input id="mappingItemFilterAll" type="checkbox" />
                <span>전체</span>
              </label>
              <div class="item-filter-options" id="mappingItemFilterOptions"></div>
              <div class="item-filter-no-results" id="mappingItemFilterNoResults" hidden>
                검색 결과가 없습니다.
              </div>
            </div>
          </section>
        </div>
      </section>

      <section
        class="tab-panel user-flow-panel"
        id="userFlowPanel"
        role="tabpanel"
        aria-labelledby="userFlowTab"
        data-popup-panel="user-flow"
      >
        <div class="user-flow-content">
          <div class="user-flow-toolbar">
            <section
              class="user-flow-notice"
              id="userFlowNotice"
              data-empty="true"
              data-collapsed="true"
              aria-label="유저 플로우 알림"
            >
              <div class="user-flow-notice-view" id="userFlowNoticeView">
                <div class="user-flow-notice-text" id="userFlowNoticeText">등록된 알림이 없습니다.</div>
                <button
                  class="user-flow-notice-edit"
                  id="userFlowNoticeEditButton"
                  type="button"
                  title="알림 수정"
                  aria-label="알림 수정"
                  data-user-flow-notice-edit
                >수정</button>
              </div>
              <button
                class="user-flow-notice-toggle"
                id="userFlowNoticeToggleButton"
                type="button"
                aria-expanded="false"
                aria-controls="userFlowNoticeText userFlowNoticeForm"
                title="알림 펼치기"
                aria-label="알림 펼치기"
                data-user-flow-notice-toggle
              ></button>
              <form class="user-flow-notice-form" id="userFlowNoticeForm" hidden>
                <textarea
                  class="user-flow-notice-input"
                  id="userFlowNoticeInput"
                  maxlength="1000"
                  placeholder="함께 전달할 알림 문구를 입력하세요."
                  aria-label="유저 플로우 알림 문구"
                ></textarea>
                <button
                  class="user-flow-notice-save"
                  type="submit"
                  title="알림 저장"
                  aria-label="알림 저장"
                >저장</button>
              </form>
            </section>
            <span class="user-flow-status" id="userFlowStatus" data-state="idle">연결 대기</span>
            <div class="user-flow-actions">
              <a
                class="user-flow-action user-flow-external-link"
                id="userFlowLoginButton"
                target="_blank"
                rel="noopener noreferrer"
              >로그인</a>
              <a
                class="user-flow-action user-flow-external-link"
                id="userFlowCommunicationButton"
                target="_blank"
                rel="noopener noreferrer"
              >통신</a>
              <button
                class="user-flow-action"
                id="userFlowImportButton"
                type="button"
                data-user-flow-import-trigger
              >직접 가져오기</button>
              <div class="user-flow-url-import">
                <button
                  class="user-flow-action"
                  id="userFlowUrlImportButton"
                  type="button"
                  aria-expanded="false"
                  aria-controls="userFlowUrlImportPanel"
                  data-user-flow-url-import-trigger
                >샘플 가져오기</button>
                <div
                  class="user-flow-url-import-panel"
                  id="userFlowUrlImportPanel"
                  hidden
                >
                  <select
                    class="user-flow-url-import-select"
                    id="userFlowUrlImportSelect"
                    aria-label="URL에서 가져올 로그"
                    size="1"
                  ></select>
                </div>
              </div>
              <button
                class="user-flow-action"
                id="userFlowExportAllButton"
                type="button"
                data-user-flow-command="export-all-recordings"
              >모두 내보내기</button>
              <button
                class="user-flow-action user-flow-new-window"
                id="userFlowCloseWindowsButton"
                type="button"
                data-user-flow-command="close-opened-windows"
                disabled
              >새창 닫기</button>
              <button
                class="user-flow-action"
                id="userFlowClearAllButton"
                type="button"
                data-action="clear-all"
                data-user-flow-command="clear"
              >모두 삭제</button>
              <button
                class="user-flow-action"
                id="userFlowRecordButton"
                type="button"
                data-action="toggle-record"
                data-user-flow-command="toggle-record"
                aria-pressed="false"
              >로그 저장</button>
              <input
                id="userFlowImportInput"
                type="file"
                accept=".json,.zip,application/json,application/zip"
                hidden
              />
            </div>
          </div>

          <div class="user-flow-view-tabs" role="tablist" aria-label="로그 화면">
            <button
              class="user-flow-view-tab"
              id="userFlowRecordingsViewTab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="userFlowRecordingsView"
              data-user-flow-view-select="recordings"
            >
              <span>로그 목록</span>
            </button>
            <button
              class="user-flow-view-tab"
              id="userFlowTestViewTab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="userFlowTestView"
              data-user-flow-view-select="test"
              data-user-flow-test-drop
            >
              <span>로그 테스트</span>
            </button>
          </div>

          <section
            class="user-flow-view-panel user-flow-sessions"
            id="userFlowRecordingsView"
            role="tabpanel"
            aria-labelledby="userFlowRecordingsViewTab"
          >
            <div class="user-flow-list-tabbar">
              <div
                class="user-flow-list-tabs"
                id="userFlowListTabs"
                role="tablist"
                aria-label="로그 목록 탭"
              >
                <div
                  class="user-flow-list-tab-wrap"
                  data-active="true"
                  data-user-flow-tab-drop="default"
                >
                  <button
                    class="user-flow-list-tab"
                    id="userFlowListTab-default"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="userFlowSessionList"
                    data-user-flow-tab-select="default"
                  >
                    <span>Tab 01</span>
                  </button>
                  <button
                    class="user-flow-list-tab-edit"
                    type="button"
                    title="Tab 01 탭 이름 수정"
                    aria-label="Tab 01 탭 이름 수정"
                    data-user-flow-tab-edit="default"
                  >✎</button>
                  <button
                    class="user-flow-list-tab-delete"
                    type="button"
                    title="Tab 01 탭 삭제"
                    aria-label="Tab 01 탭 삭제"
                    data-user-flow-tab-delete="default"
                  >×</button>
                </div>
              </div>
              <button
                class="user-flow-tab-add"
                id="userFlowTabAddButton"
                type="button"
                title="로그 목록 탭 추가"
                aria-label="로그 목록 탭 추가"
              >+</button>
            </div>
            <div
              class="user-flow-session-list"
              id="userFlowSessionList"
              role="tabpanel"
              aria-labelledby="userFlowListTab-default"
            >
              <div class="user-flow-empty">저장된 로그가 없습니다.</div>
            </div>
          </section>

          <section
            class="user-flow-view-panel user-flow-test-panel"
            id="userFlowTestView"
            role="tabpanel"
            aria-labelledby="userFlowTestViewTab"
            hidden
          >
            <div
              class="user-flow-session-list"
              id="userFlowTestSessionList"
              aria-live="polite"
            >
              <div class="user-flow-empty">로그 목록을 이 탭으로 끌어다 놓아주세요.</div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div
      class="user-flow-move-toast"
      id="userFlowMoveToast"
      role="status"
      aria-live="polite"
    ></div>

    <script>
      // 로그인 버튼의 이동 경로는 이 값만 수정하면 됩니다.
      window.USER_FLOW_LOGIN_URL = "/login";

      // 통신 버튼의 이동 경로는 이 값만 수정하면 됩니다.
      window.USER_FLOW_COMMUNICATION_URL = "/communication";

      window.USER_FLOW_IMPORT_URLS = [
        // { name: "로그인 플로우", url: "/flowData/login.json" },
        // { name: "공통 플로우", url: "/flowData/common-flows.zip" },
      ];
    </script>
    <script src="./js/popup-core.js"></script>
  </body>
</html>
