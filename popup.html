<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통신 응답 매핑 리스트</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #ffffff;
        color: #17202a;
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .wrap {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 8px;
        height: 100%;
        padding: 12px;
      }

      .list {
        display: grid;
        align-content: start;
        gap: 8px;
        min-height: 0;
        overflow: auto;
      }

      .row {
        padding: 11px 12px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        background: #fbfdff;
      }

      .row[hidden] {
        display: none;
      }

      .mapped-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 10px;
      }

      .mapped-item-tree {
        min-width: 0;
      }

      .detail-toggle {
        min-height: 26px;
        padding: 3px 8px;
        border: 1px solid #c9d3df;
        border-radius: 4px;
        background: #ffffff;
        color: #475569;
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
        cursor: pointer;
      }

      .detail-toggle:hover {
        border-color: #94a3b8;
        color: #17202a;
      }

      .mapped-item-details {
        margin-top: 8px;
        padding-top: 9px;
        border-top: 1px solid #e2e8f0;
      }

      .mapped-item-details[hidden] {
        display: none;
      }

      .detail-title {
        color: #475569;
        font-size: 12px;
        font-weight: 800;
      }

      .detail-title {
        margin-bottom: 6px;
      }

      .detail-group-title {
        display: grid;
        grid-template-columns: 22px auto minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        min-height: 30px;
        margin-bottom: 7px;
        padding: 4px 8px;
        border-left: 3px solid #1266d6;
        background: #eef3f8;
        color: #475569;
        font-size: 12px;
      }

      .detail-group-number {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #1266d6;
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
      }

      .detail-group-label {
        font-weight: 800;
        white-space: nowrap;
      }

      .detail-group-value {
        min-width: 0;
        color: #17202a;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .detail-group + .detail-group {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 2px solid #d9e1ea;
      }

      .detail-empty {
        padding: 4px 0 2px 36px;
        color: #7b8797;
        font-size: 12px;
      }

      .tree-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        min-height: 24px;
        padding-left: calc(var(--depth) * 18px);
        color: #17202a;
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      .tree-prefix {
        flex: 0 0 10px;
        color: #8a97a8;
      }

      .tree-toggle,
      .tree-toggle-placeholder {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        margin-top: 1px;
      }

      .tree-toggle {
        display: inline-grid;
        place-items: center;
        border: 1px solid #c9d3df;
        border-radius: 4px;
        background: #ffffff;
        color: #334155;
        cursor: pointer;
      }

      .tree-toggle::before {
        content: "";
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 6px solid currentColor;
      }

      .tree-toggle[aria-expanded="false"]::before {
        transform: rotate(-90deg);
      }

      .tree-name {
        color: #667385;
        font-weight: 800;
      }

      .tree-separator {
        color: #667385;
        font-weight: 800;
      }

      .tree-value {
        color: #17202a;
        white-space: pre-wrap;
      }

      .empty {
        min-height: 160px;
        display: grid;
        place-items: center;
        border: 1px dashed #b8c5d5;
        border-radius: 8px;
        color: #667385;
        text-align: center;
      }

      .item-filter {
        border: 1px solid #d9e1ea;
        border-radius: 6px;
        background: #ffffff;
        box-shadow: 0 -4px 14px rgba(23, 32, 42, 0.06);
      }

      .item-filter[hidden] {
        display: none;
      }

      .item-filter-bar {
        display: grid;
        grid-template-columns: auto minmax(100px, 1fr);
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 4px 6px;
      }

      .item-filter-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding: 4px;
        border: 0;
        background: transparent;
        color: #475569;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        user-select: none;
      }

      .item-filter-chevron {
        width: 7px;
        height: 7px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
      }

      .item-filter-toggle[aria-expanded="true"] .item-filter-chevron {
        transform: rotate(225deg) translate(-1px, -1px);
      }

      .item-filter-search {
        width: 100%;
        height: 26px;
        padding: 3px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        outline: none;
        color: #17202a;
        background: #ffffff;
        font: inherit;
        font-size: 12px;
      }

      .item-filter-search:focus {
        border-color: #1266d6;
        box-shadow: 0 0 0 2px rgba(18, 102, 214, 0.12);
      }

      .item-filter-panel {
        max-height: calc(100vh - 68px);
        max-height: calc(100dvh - 68px);
        padding: 8px 10px 10px;
        border-top: 1px solid #e5eaf0;
        overflow: auto;
      }

      .item-filter-panel[hidden],
      .item-filter-label[hidden],
      .item-filter-no-results[hidden] {
        display: none;
      }

      .item-filter-all {
        padding-bottom: 7px;
        border-bottom: 1px solid #edf1f5;
      }

      .item-filter-options {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 6px 12px;
        padding-top: 7px;
      }

      .item-filter-label {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: #334155;
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
      }

      .item-filter-label input {
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: #1266d6;
      }

      .item-filter-label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-filter-no-results {
        padding: 10px 0 2px;
        color: #7b8797;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 560px) {
        .mapped-item {
          gap: 6px;
        }

        .tree-row {
          padding-left: calc(var(--depth) * 14px);
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="list" id="mappingList">
        <div class="empty">통신 응답을 기다리는 중입니다.</div>
      </div>

      <section class="item-filter" id="mappingItemFilter" hidden>
        <div class="item-filter-bar">
          <button
            class="item-filter-toggle"
            id="mappingItemFilterToggle"
            type="button"
            aria-expanded="false"
            aria-controls="mappingItemFilterPanel"
            title="표시 항목 열기"
          >
            <span id="mappingItemFilterSummary">표시 항목 0/0</span>
            <span class="item-filter-chevron" aria-hidden="true"></span>
          </button>
          <input
            class="item-filter-search"
            id="mappingItemFilterSearch"
            type="search"
            placeholder="항목명 또는 키 검색"
            aria-label="표시 항목 검색"
          />
        </div>
        <div class="item-filter-panel" id="mappingItemFilterPanel" hidden>
          <label class="item-filter-label item-filter-all">
            <input id="mappingItemFilterAll" type="checkbox" />
            <span>전체</span>
          </label>
          <div class="item-filter-options" id="mappingItemFilterOptions"></div>
          <div class="item-filter-no-results" id="mappingItemFilterNoResults" hidden>검색 결과가 없습니다.</div>
        </div>
      </section>
    </main>

    <script src="./js/response-mapping-popup.js"></script>
  </body>
</html>
