<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>응답 전문 표시 패널</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-strong: #eef3f8;
        --text: #17202a;
        --muted: #667385;
        --line: #d9e1ea;
        --accent: #1266d6;
        --accent-strong: #0b54b5;
        --success: #0f8a5f;
        --warning: #a15c00;
        --danger: #b42318;
        --shadow: 0 16px 44px rgba(23, 32, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.65), rgba(244, 247, 251, 0)),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .title-group {
        display: grid;
        gap: 6px;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .send-button {
        min-width: 112px;
        height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(18, 102, 214, 0.22);
        transition:
          transform 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .send-button:hover {
        background: var(--accent-strong);
        box-shadow: 0 10px 24px rgba(18, 102, 214, 0.28);
      }

      .send-button:active {
        transform: translateY(1px);
      }

      .send-button:disabled {
        cursor: progress;
        opacity: 0.68;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
        gap: 18px;
      }

      .main-stack {
        display: grid;
        gap: 18px;
        align-content: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        margin: 0;
        font-size: 17px;
        line-height: 1.3;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel-strong);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.success {
        background: #e8f6f0;
        color: var(--success);
      }

      .badge.warning {
        background: #fff2e0;
        color: var(--warning);
      }

      .content {
        padding: 18px 20px 20px;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .result-card {
        min-height: 96px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .result-name {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .result-value {
        margin: 0;
        color: var(--text);
        font-size: 18px;
        font-weight: 800;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .result-value.code-value {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        white-space: pre-wrap;
      }

      .result-key {
        display: block;
        margin-top: 8px;
        color: #7d8a9d;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow-wrap: anywhere;
      }

      .result-paths {
        display: block;
        margin-top: 6px;
        color: #52616f;
        font-size: 12px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .empty-state {
        display: grid;
        place-items: center;
        min-height: 280px;
        border: 1px dashed #b8c5d5;
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
      }

      .side-stack {
        display: grid;
        gap: 18px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        background: #f8fafc;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td code {
        color: #31506f;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .log-box {
        min-height: 164px;
        margin: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #101820;
        color: #d8f0ff;
        font-size: 12px;
        line-height: 1.65;
        overflow: auto;
        white-space: pre-wrap;
      }

      .transaction {
        display: grid;
        gap: 10px;
      }

      .step-row {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 10px;
        align-items: start;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfdff;
      }

      .step-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .step-value {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .unmatched {
        color: var(--warning);
      }

      .exception-panel {
        border-color: #f0c0b8;
      }

      .exception-list {
        display: grid;
        gap: 12px;
      }

      .exception-item {
        padding: 14px;
        border: 1px solid #f0c0b8;
        border-radius: 8px;
        background: #fff9f8;
      }

      .exception-title {
        margin: 0 0 10px;
        color: var(--danger);
        font-size: 14px;
        font-weight: 800;
      }

      .exception-key {
        color: #7d554d;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .exception-value-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .exception-value {
        margin: 0;
        padding: 10px;
        border: 1px solid #f2d6d0;
        border-radius: 8px;
        background: #ffffff;
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .exception-path {
        display: block;
        margin-bottom: 5px;
        color: #895249;
        font-weight: 800;
      }

      .exception-text {
        display: block;
      }

      @media (max-width: 860px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .send-button {
          width: 100%;
        }

        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .app {
          width: min(100% - 20px, 1180px);
          padding: 18px 0;
        }

        h1 {
          font-size: 26px;
        }

        .result-grid {
          grid-template-columns: 1fr;
        }

        .panel-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .step-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title-group">
          <h1>응답 전문 표시 패널</h1>
          <p class="subtitle">테스트 요청을 보내고, 응답 JSON의 키를 매핑 테이블의 항목명으로 변환해 표시합니다.</p>
        </div>
        <button class="send-button" id="sendButton" type="button">전송</button>
      </header>

      <section class="layout" aria-label="응답 전문 테스트 영역">
        <section class="main-stack">
          <article class="panel">
            <div class="panel-header">
              <h2 class="panel-title">매핑된 응답값</h2>
              <span class="badge" id="statusBadge">대기중</span>
            </div>
            <div class="content">
              <div class="empty-state" id="emptyState">
                전송 버튼을 누르면 더미 응답 전문이 항목명 기준으로 정리됩니다.
              </div>
              <div class="result-grid" id="resultGrid" hidden></div>
            </div>
          </article>

          <article class="panel exception-panel" id="exceptionPanel" hidden>
            <div class="panel-header">
              <h2 class="panel-title">예외</h2>
              <span class="badge warning" id="exceptionCount">0건</span>
            </div>
            <div class="content">
              <div class="exception-list" id="exceptionList"></div>
            </div>
          </article>
        </section>

        <aside class="side-stack">
          <article class="panel">
            <div class="panel-header">
              <h2 class="panel-title">요청 / 응답 흐름</h2>
              <span class="badge" id="matchedCount">0건</span>
            </div>
            <div class="content">
              <div class="transaction" id="transactionLog">
                <div class="step-row">
                  <span class="step-label">상태</span>
                  <p class="step-value">아직 전송된 요청이 없습니다.</p>
                </div>
              </div>
            </div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2 class="panel-title">매핑 테이블</h2>
              <span class="badge" id="mappingCount">0개 항목</span>
            </div>
            <div class="content">
              <table aria-label="응답 키 매핑 테이블">
                <thead>
                  <tr>
                    <th>항목명</th>
                    <th>키값</th>
                  </tr>
                </thead>
                <tbody id="mappingTable"></tbody>
              </table>
            </div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2 class="panel-title">원본 응답 JSON</h2>
            </div>
            <div class="content">
              <pre class="log-box" id="rawResponse">{}</pre>
            </div>
          </article>
        </aside>
      </section>
    </main>

    <iframe id="fieldSourceFrame" title="응답 항목 매핑 데이터" hidden></iframe>
    <script src="./js/app.js"></script>
  </body>
</html>
